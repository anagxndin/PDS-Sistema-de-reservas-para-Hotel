<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirme sua reserva - Hospedagem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Hospedagem</a>
        <div>
            <a class="nav-link d-inline text-light" th:href="@{/acomodacoes/buscar}">Nova busca</a>
            <a class="nav-link d-inline text-light" th:href="@{/reservas}">Minhas reservas</a>
        </div>
    </div>
</nav>

<div class="container mt-5" style="max-width: 640px;">
    <h1 class="h4 mb-1">Confirme sua reserva</h1>
    <p class="text-muted" th:if="${acomodacao != null}">
        <span th:text="${acomodacao.nome}">Acomodação</span> ·
        <span th:text="${checkin}">Check-in</span> a <span th:text="${checkout}">Check-out</span> ·
        R$ <span th:text="${acomodacao.precoDiaria}">200.00</span> / diária
    </p>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/reservas}" th:object="${reservaRequest}" method="post" novalidate>
        <input type="hidden" th:field="*{acomodacaoId}"/>
        <input type="hidden" th:field="*{checkin}"/>
        <input type="hidden" th:field="*{checkout}"/>

        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">Seus dados</h5>

                <div class="mb-3">
                    <label class="form-label" for="cpf">CPF</label>
                    <input type="text" class="form-control" id="cpf" th:field="*{cpf}" placeholder="000.000.000-00">
                    <div class="text-danger small" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                </div>

                <div class="mb-1">
                    <label class="form-label" for="telefone">Telefone</label>
                    <input type="text" class="form-control" id="telefone" th:field="*{telefone}" placeholder="(00) 00000-0000">
                    <div class="text-danger small" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">Pagamento</h5>

                <div class="mb-3">
                    <label class="form-label" for="tipoPagamento">Forma de pagamento</label>
                    <select class="form-select" id="tipoPagamento" th:field="*{dadosPagamento.tipo}" onchange="alternarCampoCartao(this.value)">
                        <option value="">Selecione</option>
                        <option th:each="tipo : ${tiposPagamento}" th:value="${tipo}" th:text="${tipo}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('dadosPagamento.tipo')}" th:errors="*{dadosPagamento.tipo}"></div>
                </div>

                <div id="camposCartao" style="display:none;">
                    <div class="mb-3">
                        <label class="form-label" for="nomeTitular">Nome no cartão</label>
                        <input type="text" class="form-control" id="nomeTitular" th:field="*{dadosPagamento.nomeTitular}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="numeroCartao">Número do cartão</label>
                        <input type="text" class="form-control" id="numeroCartao" th:field="*{dadosPagamento.numeroCartao}" placeholder="0000 0000 0000 0000">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label" for="validade">Validade (MM/AA)</label>
                            <input type="text" class="form-control" id="validade" th:field="*{dadosPagamento.validade}" placeholder="MM/AA">
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="cvv">CVV</label>
                            <input type="text" class="form-control" id="cvv" th:field="*{dadosPagamento.cvv}" placeholder="000">
                        </div>
                    </div>

                    <div class="mb-1">
                        <label class="form-label" for="bandeira">Bandeira</label>
                        <input type="text" class="form-control" id="bandeira" th:field="*{dadosPagamento.bandeira}" placeholder="Visa, Mastercard...">
                    </div>
                    <p class="form-text">Guardamos só os 4 últimos dígitos do cartão, nada mais.</p>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-5">Finalizar reserva</button>
    </form>
</div>

<script>
    function alternarCampoCartao(valor) {
        document.getElementById('camposCartao').style.display = (valor && valor !== 'PIX') ? 'block' : 'none';
    }
    document.addEventListener('DOMContentLoaded', function () {
        alternarCampoCartao(document.getElementById('tipoPagamento').value);
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
