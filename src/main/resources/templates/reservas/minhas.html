<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minhas reservas - Hospedagem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Hospedagem</a>
        <a class="nav-link d-inline text-light" th:href="@{/acomodacoes/buscar}">Nova reserva</a>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="h4 mb-4">Minhas reservas</h1>

    <div th:if="${param.cancelamentoSucesso}" class="alert alert-success">
        Reserva cancelada com sucesso.
    </div>

    <div th:if="${#lists.isEmpty(reservas)}" class="alert alert-info">
        Você ainda não tem nenhuma reserva.
        <a th:href="@{/acomodacoes/buscar}">Buscar disponibilidade</a>
    </div>

    <table class="table table-hover align-middle" th:unless="${#lists.isEmpty(reservas)}">
        <thead>
        <tr>
            <th>Acomodação</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Valor</th>
            <th>Status</th>
            <th class="text-end">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservas}">
            <td th:text="${r.acomodacaoNome}">Suíte Standard</td>
            <td th:text="${r.checkin}">2026-08-01</td>
            <td th:text="${r.checkout}">2026-08-05</td>
            <td>R$ <span th:text="${r.valorTotal}">600.00</span></td>
            <td>
                <span class="badge"
                      th:classappend="${r.status.name() == 'CONFIRMADA'} ? 'bg-success' : (${r.status.name() == 'CANCELADA'} ? 'bg-danger' : 'bg-warning text-dark')"
                      th:text="${r.status}">PENDENTE</span>
            </td>
            <td class="text-end">
               
                <a th:if="${r.status.name() != 'CANCELADA'
                           and r.checkin.isAfter(T(java.time.LocalDate).now().minusDays(1))}"
                   th:href="@{/reservas/{id}/cancelar(id=${r.id})}"
                   class="btn btn-outline-danger btn-sm">
                    Cancelar
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
