<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reserva confirmada - Hospedagem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Hospedagem</a>
        <a class="nav-link d-inline text-light" th:href="@{/reservas}">Minhas reservas</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 560px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <span class="badge bg-warning text-dark mb-2" th:text="${reserva.status}">PENDENTE</span>
            <h1 class="h5 mb-4">Reserva #<span th:text="${reserva.id}">1</span> registrada com sucesso</h1>

            <dl class="row mb-0">
                <dt class="col-5 text-muted fw-normal">Acomodação</dt>
                <dd class="col-7" th:text="${reserva.acomodacaoNome}">Suíte</dd>

                <dt class="col-5 text-muted fw-normal">Período</dt>
                <dd class="col-7">
                    <span th:text="${reserva.checkin}">2026-08-01</span> a
                    <span th:text="${reserva.checkout}">2026-08-05</span>
                </dd>

                <dt class="col-5 text-muted fw-normal">CPF</dt>
                <dd class="col-7" th:text="${reserva.cpf}">00000000000</dd>

                <dt class="col-5 text-muted fw-normal">Telefone</dt>
                <dd class="col-7" th:text="${reserva.telefone}">00000000000</dd>

                <dt class="col-5 text-muted fw-normal">Pagamento</dt>
                <dd class="col-7">
                    <span th:text="${reserva.formaPagamento}">PIX</span>
                    <span th:if="${reserva.pagamentoUltimosDigitos != null}">
                        · final <span th:text="${reserva.pagamentoUltimosDigitos}">1234</span>
                    </span>
                </dd>

                <dt class="col-5 text-muted fw-normal">Valor total</dt>
                <dd class="col-7 fw-bold">R$ <span th:text="${reserva.valorTotal}">600.00</span></dd>
            </dl>

            <a class="btn btn-primary mt-4" th:href="@{/reservas}">Ver minhas reservas</a>
        </div>
    </div>
</div>

<!-- Notificacao confirmando a conclusao da reserva. Os dados ja estao
     persistidos nesse ponto (ReservaService.criarReserva ja gravou no banco
     antes do redirect para esta tela), este toast so avisa o usuario. -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toastReservaConcluida" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                Reserva concluída com sucesso!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        new bootstrap.Toast(document.getElementById('toastReservaConcluida')).show();
    });
</script>
</body>
</html>
