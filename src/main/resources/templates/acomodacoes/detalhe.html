<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${acomodacao.nome()} + ' - Hospedagem'">Acomodação - Hospedagem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Hospedagem</a>
        <a class="nav-link d-inline text-light" th:href="@{/acomodacoes}">Voltar</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <img th:if="${acomodacao.urlImagem()}" th:src="${acomodacao.urlImagem()}" class="img-fluid rounded" alt="">
        </div>
        <div class="col-md-6">
            <h1 class="h3" th:text="${acomodacao.nome()}">Nome</h1>
            <h6 class="text-muted mb-3" th:text="${acomodacao.tipo()}">Tipo</h6>
            <p th:text="${acomodacao.descricao()}">Descrição</p>
            <p>Capacidade: <span th:text="${acomodacao.capacidade()}">2</span> pessoa(s)</p>
            <p class="fw-bold fs-4" th:text="'R$ ' + ${acomodacao.precoDiaria()} + ' / diária'"></p>

            <a th:href="@{/acomodacoes/buscar}" class="btn btn-primary">Verificar disponibilidade</a>
        </div>
    </div>
</div>
</body>
</html>
