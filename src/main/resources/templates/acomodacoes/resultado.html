<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultados - Hospedagem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Hospedagem</a>
        <a class="nav-link d-inline text-light" th:href="@{/acomodacoes/buscar}">Nova busca</a>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="h4">Disponibilidade</h1>
    <p class="text-muted">
        <span th:text="${checkin}"></span> a <span th:text="${checkout}"></span>
    </p>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div th:if="${resultado != null and #lists.isEmpty(resultado)}" class="alert alert-warning">
        Nenhuma acomodação disponível para o período selecionado.
    </div>

    <div class="row g-4 mt-2">
        <div class="col-md-4" th:each="a : ${resultado}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${a.nome}">Nome</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${a.tipo}">Tipo</h6>
                    <p class="card-text" th:text="${a.descricao}">Descrição</p>
                    <p class="fw-bold" th:text="'R$ ' + ${a.precoDiaria} + ' / diária'"></p>
                    <p class="small text-muted" th:text="'Capacidade: ' + ${a.capacidade}"></p>
                    <a class="btn btn-primary btn-sm"
                       th:href="@{/reservas/nova(acomodacaoId=${a.id}, checkin=${checkin}, checkout=${checkout})}">
                        Reservar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
