<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acomodações - Hospedagem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Hospedagem</a>
        <a class="nav-link d-inline text-light" th:href="@{/acomodacoes/buscar}">Buscar por data</a>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="h4 mb-4">Tipos de acomodação</h1>

    <div class="mb-4">
        <a th:href="@{/acomodacoes}" class="btn btn-sm btn-outline-secondary"
           th:classappend="${tipoSelecionado == null} ? 'active' : ''">Todos</a>
        <a th:each="t : ${tipos}" th:href="@{/acomodacoes(tipo=${t})}"
           class="btn btn-sm btn-outline-secondary"
           th:classappend="${tipoSelecionado == t} ? 'active' : ''" th:text="${t}"></a>
    </div>

    <div class="row g-4">
        <div class="col-md-4" th:each="a : ${acomodacoes}">
            <div class="card h-100">
                <img th:if="${a.urlImagem}" th:src="${a.urlImagem}" class="card-img-top" alt="">
                <div class="card-body">
                    <h5 class="card-title" th:text="${a.nome}">Nome</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${a.tipo}">Tipo</h6>
                    <p class="card-text" th:text="${a.descricao}">Descrição</p>
                    <p class="fw-bold" th:text="'R$ ' + ${a.precoDiaria} + ' / diária'"></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
