<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar disponibilidade - Hospedagem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Hospedagem</a>
        <div>
            <a class="nav-link d-inline text-light" th:href="@{/acomodacoes}">Acomodações</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="h4 mb-4">Consultar disponibilidade</h1>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/acomodacoes/resultado}" th:object="${buscaRequest}" method="get" class="row g-3">
        <div class="col-md-4">
            <label class="form-label" for="checkin">Check-in</label>
            <input type="date" class="form-control" id="checkin" th:field="*{checkin}">
            <div class="text-danger small" th:if="${#fields.hasErrors('checkin')}" th:errors="*{checkin}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="checkout">Check-out</label>
            <input type="date" class="form-control" id="checkout" th:field="*{checkout}">
            <div class="text-danger small" th:if="${#fields.hasErrors('checkout')}" th:errors="*{checkout}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="tipo">Tipo de acomodação</label>
            <select class="form-select" id="tipo" th:field="*{tipo}">
                <option value="">Todos</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </form>
</div>
</body>
</html>
