<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Hospedagem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Hospedagem</span>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
        </form>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="h3">Bem-vindo(a), <span th:text="${nome}">Usuario</span>!</h1>
    <p class="text-muted" th:text="${email}">email@exemplo.com</p>

    <div class="alert alert-secondary mt-4">
        Login autenticado via JWT funcionando. A partir daqui entram as telas de
        consulta de acomodacoes, reserva, cancelamento e confirmacao.
    </div>
</div>
</body>
</html>
