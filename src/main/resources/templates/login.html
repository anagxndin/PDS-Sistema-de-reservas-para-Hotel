<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Hospedagem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container auth-container">
    <div class="card auth-card">
        <div class="card-body">
            <h1 class="h4 mb-3 text-center">Entrar</h1>

            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
            <div th:if="${param.cadastroSucesso}" class="alert alert-success">
                Cadastro realizado com sucesso! Faca login para continuar.
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                Voce saiu da sua conta.
            </div>

            <form th:action="@{/login}" th:object="${loginRequest}" method="post" novalidate>

                <div class="mb-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="senha">Senha</label>
                    <input type="password" class="form-control" id="senha" th:field="*{senha}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Ainda nao tem conta? <a th:href="@{/register}">Cadastre-se</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
